<!doctype html>
<html lang="en" data-skin="pixel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1426">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Munchkin">
<meta name="description" content="Phone tracker for your Munchkin level, gear bonuses, and extra items, in pixel or modern style.">
<title>Munchkin Power Tracker</title>
<script>
  // Apply the saved look before the page paints, so it doesn't flash.
  try { if (localStorage.getItem("munchkin-skin") === "modern") document.documentElement.dataset.skin = "modern"; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Layout: one phone column. Sticky power bar on top, level card, gear slots, extra items.
   Two looks: "pixel" (default, 8-bit dungeon) and "modern" (clean cards, line icons). */
:root {
  --bg: #1b1426;        /* dungeon night */
  --grid: #211934;
  --panel: #2a2040;     /* stone slab */
  --panel-2: #362a52;
  --ink: #f4ead2;       /* parchment text */
  --dim: #a99cc4;
  --gold: #ffcc33;      /* treasure: the accent */
  --on-gold: #0d0915;
  --red: #e8473c;
  --green: #5fd068;
  --up-bg: #2f5a35;
  --down-bg: #6b2a2a;
  --edge: #0d0915;      /* pixel outline */
  --tint: transparent;
  --font-pixel: "Press Start 2P", ui-monospace, monospace;
  --font-body: "VT323", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
html[data-skin="modern"] {
  --bg: #f2f3f7;
  --grid: #f2f3f7;
  --panel: #ffffff;
  --panel-2: #eceef4;
  --ink: #151722;
  --dim: #6a6f82;
  --gold: #5146e0;      /* indigo accent */
  --on-gold: #ffffff;
  --red: #d93636;
  --green: #17a34a;
  --up-bg: #17a34a;
  --down-bg: #eceef4;
  --edge: #e2e5ee;
  --tint: #ecebfd;
  --font-pixel: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  html[data-skin="modern"]:not([data-theme="light"]) {
    --bg: #101219; --grid: #101219; --panel: #1a1d27; --panel-2: #252937;
    --ink: #eef0f6; --dim: #9196a8; --gold: #8b84ff; --on-gold: #0f1020;
    --red: #f06464; --green: #3ccf72; --up-bg: #23a35a; --down-bg: #252937;
    --edge: #2a2e3c; --tint: #24234a; color-scheme: dark;
  }
}
html[data-skin="modern"][data-theme="dark"] {
  --bg: #101219; --grid: #101219; --panel: #1a1d27; --panel-2: #252937;
  --ink: #eef0f6; --dim: #9196a8; --gold: #8b84ff; --on-gold: #0f1020;
  --red: #f06464; --green: #3ccf72; --up-bg: #23a35a; --down-bg: #252937;
  --edge: #2a2e3c; --tint: #24234a; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 22px;
  line-height: 1.15;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
  background-image:
    linear-gradient(var(--bg) 2px, transparent 2px),
    linear-gradient(90deg, var(--bg) 2px, transparent 2px);
  background-size: 24px 24px;
  background-color: var(--grid);
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* Icons: every icon holds a pixel canvas and a modern SVG; the look decides which shows. */
.icon { display: inline-grid; place-items: center; }
.icon .mod { display: none; }
html[data-skin="modern"] .icon .pix { display: none; }
html[data-skin="modern"] .icon .mod { display: block; }
.icon canvas { image-rendering: pixelated; }

/* Pixel box: chunky stepped border */
.px {
  background: var(--panel);
  box-shadow:
    0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge),
    -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge),
    inset 0 4px 0 0 rgba(255,255,255,.07), inset 0 -4px 0 0 rgba(0,0,0,.25);
}

header.power {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 14px max(16px, env(safe-area-inset-left, 0px)) 14px;
  background: var(--bg);
  border-bottom: 4px solid var(--edge);
}
.power-inner { max-width: 480px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.brand { font-family: var(--font-pixel); font-size: 10px; color: var(--gold); letter-spacing: 1px; line-height: 1.6; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.brand small { display: block; color: var(--dim); font-size: 8px; }
.strength { text-align: right; }
.strength .lbl { font-family: var(--font-pixel); font-size: 8px; color: var(--dim); letter-spacing: 1px; }
.strength .num { font-family: var(--font-pixel); font-size: 34px; color: var(--gold); text-shadow: 3px 3px 0 var(--edge); font-variant-numeric: tabular-nums; }
.math { font-size: 18px; color: var(--dim); text-align: right; }

/* Look toggle */
.skin { display: inline-flex; background: var(--edge); padding: 3px; gap: 3px; }
.skin button {
  font-family: var(--font-pixel); font-size: 8px; letter-spacing: 1px; text-transform: uppercase;
  padding: 7px 8px; background: transparent; color: var(--dim);
}
.skin button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); }

h2 {
  font-family: var(--font-pixel); font-size: 11px; letter-spacing: 1px; color: var(--gold);
  margin: 6px 0 -4px; text-shadow: 2px 2px 0 var(--edge); text-transform: uppercase;
  display: flex; justify-content: space-between; align-items: baseline;
}
h2 span { color: var(--dim); font-size: 9px; }

/* Level card */
.level { padding: 16px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.level .big {
  text-align: center; font-family: var(--font-pixel); font-size: 56px; color: var(--ink);
  text-shadow: 4px 4px 0 var(--edge); font-variant-numeric: tabular-nums;
}
.level .cap { text-align: center; font-family: var(--font-pixel); font-size: 8px; color: var(--dim); margin-top: 8px; letter-spacing: 1px; text-transform: uppercase; }
.level.win .big { color: var(--gold); animation: blink .6s steps(2) infinite; }
.level.win .cap { color: var(--gold); }
@keyframes blink { 50% { opacity: .55; } }
.pips { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.pips i { height: 10px; background: var(--edge); }
.pips i.on { background: var(--gold); }

/* Buttons */
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
.btn {
  width: 56px; height: 56px; display: grid; place-items: center;
  background: var(--panel-2); color: var(--ink);
  box-shadow: 0 -3px 0 var(--edge), 0 3px 0 var(--edge), -3px 0 0 var(--edge), 3px 0 0 var(--edge), inset 0 -5px 0 rgba(0,0,0,.35);
  touch-action: manipulation;
}
.btn:active { transform: translateY(3px); box-shadow: 0 -3px 0 var(--edge), 0 3px 0 var(--edge), -3px 0 0 var(--edge), 3px 0 0 var(--edge), inset 0 3px 0 rgba(0,0,0,.35); }
.btn:focus-visible, .tbtn:focus-visible, .skin button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.btn.up { background: var(--up-bg); } .btn.down { background: var(--down-bg); }
.btn.lg { width: 68px; height: 68px; }
.btn.sm { width: 44px; height: 44px; }

/* Gear rows */
.slots { display: flex; flex-direction: column; gap: 14px; }
.slot { padding: 10px 12px; display: grid; grid-template-columns: 40px 1fr auto 52px auto; align-items: center; gap: 10px; }
.slot .ico { width: 40px; height: 40px; }
.slot .name { min-width: 0; }
.slot .name b { display: block; font-family: var(--font-pixel); font-size: 10px; font-weight: 400; line-height: 1.5; text-transform: uppercase; }
.slot .name small { color: var(--dim); font-size: 18px; display: block; }
.slot .val {
  text-align: center; font-family: var(--font-pixel); font-size: 18px; font-variant-numeric: tabular-nums;
  color: var(--dim);
}
.slot .val.pos { color: var(--green); } .slot .val.neg { color: var(--red); }
.slot input.name-in {
  width: 100%; min-width: 0; background: var(--edge); color: var(--ink); border: 0;
  font-family: var(--font-body); font-size: 22px; padding: 6px 8px;
}
.slot.extra { grid-template-columns: 1fr auto 52px auto; }
.slot.extra .del { grid-column: 1 / -1; justify-self: start; }

.tbtn {
  font-family: var(--font-pixel); font-size: 10px; letter-spacing: 1px; padding: 14px 14px; text-transform: uppercase;
  background: var(--panel-2); color: var(--ink);
  box-shadow: 0 -3px 0 var(--edge), 0 3px 0 var(--edge), -3px 0 0 var(--edge), 3px 0 0 var(--edge), inset 0 -4px 0 rgba(0,0,0,.35);
}
.tbtn:active { transform: translateY(3px); }
.tbtn.gold { background: var(--gold); color: var(--on-gold); }
.tbtn.ghost { background: transparent; box-shadow: none; color: var(--dim); padding: 6px 0; font-size: 8px; }
.tbtn.danger { background: var(--red); color: #fff; }
.row { display: flex; gap: 14px; flex-wrap: wrap; }
.row .tbtn { flex: 1; }
.empty { color: var(--dim); font-size: 20px; padding: 4px 2px; margin: 0; }
.foot { color: var(--dim); font-size: 18px; text-align: center; }

/* ---------- Modern look overrides ---------- */
html[data-skin="modern"] body { background-image: none; font-size: 16px; line-height: 1.4; }
html[data-skin="modern"] .wrap { gap: 14px; }
html[data-skin="modern"] .px {
  border-radius: 20px; border: 1px solid var(--edge);
  box-shadow: 0 1px 2px rgba(16,18,30,.05), 0 6px 20px rgba(16,18,30,.05);
}
html[data-skin="modern"] header.power {
  border-bottom: 1px solid var(--edge);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
html[data-skin="modern"] .brand { font-size: 17px; font-weight: 800; letter-spacing: -.01em; color: var(--ink); line-height: 1.2; }
html[data-skin="modern"] .brand small { font-size: 12px; font-weight: 600; letter-spacing: 0; margin-top: 2px; }
html[data-skin="modern"] .strength .lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; }
html[data-skin="modern"] .strength .num { font-size: 40px; font-weight: 800; text-shadow: none; line-height: 1.05; letter-spacing: -.02em; }
html[data-skin="modern"] .math { font-size: 13px; font-weight: 500; }
html[data-skin="modern"] .skin { border-radius: 999px; background: var(--panel-2); }
html[data-skin="modern"] .skin button { font-size: 12px; font-weight: 700; letter-spacing: 0; text-transform: none; border-radius: 999px; padding: 6px 12px; }
html[data-skin="modern"] h2 { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--dim); text-shadow: none; margin: 10px 4px -2px; }
html[data-skin="modern"] h2 span { font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 600; }
html[data-skin="modern"] .level { padding: 18px; }
html[data-skin="modern"] .level .big { font-size: 68px; font-weight: 800; text-shadow: none; line-height: 1; letter-spacing: -.03em; }
html[data-skin="modern"] .level .cap { font-size: 12px; font-weight: 600; letter-spacing: .04em; }
html[data-skin="modern"] .level.win .big { animation: none; }
html[data-skin="modern"] .pips i { height: 8px; border-radius: 999px; }
html[data-skin="modern"] .btn { border-radius: 16px; box-shadow: none; transition: transform .08s ease, filter .15s ease; }
html[data-skin="modern"] .btn:active { transform: scale(.94); box-shadow: none; }
html[data-skin="modern"] .btn.up { color: #fff; }
html[data-skin="modern"] .btn.sm { border-radius: 12px; }
html[data-skin="modern"] .slot { padding: 12px 14px; }
html[data-skin="modern"] .slot .ico { background: var(--tint); color: var(--gold); border-radius: 12px; }
html[data-skin="modern"] .slot .name b { font-size: 15px; font-weight: 700; text-transform: none; line-height: 1.3; }
html[data-skin="modern"] .slot .name small { font-size: 13px; }
html[data-skin="modern"] .slot .val { font-size: 22px; font-weight: 800; }
html[data-skin="modern"] .slot input.name-in {
  background: var(--panel-2); border-radius: 10px; font-size: 16px; font-weight: 600; padding: 10px 12px;
}
html[data-skin="modern"] .tbtn { font-size: 15px; font-weight: 700; letter-spacing: 0; text-transform: none; border-radius: 14px; box-shadow: none; padding: 15px; }
html[data-skin="modern"] .tbtn:active { transform: scale(.98); }
html[data-skin="modern"] .tbtn.ghost { font-size: 13px; padding: 4px 0; color: var(--red); }
html[data-skin="modern"] .tbtn.danger { background: transparent; color: var(--red); border: 1.5px solid var(--red); }
html[data-skin="modern"] .empty { font-size: 15px; }
html[data-skin="modern"] .foot { font-size: 13px; }

@media (max-width: 360px) {
  .slot { grid-template-columns: 32px 1fr auto 44px auto; gap: 8px; }
  .slot .ico { width: 32px; height: 32px; }
  .btn.sm { width: 40px; height: 40px; }
  .level .big { font-size: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  .level.win .big { animation: none; }
  .btn:active, .tbtn:active, html[data-skin="modern"] .btn:active, html[data-skin="modern"] .tbtn:active { transform: none; }
}
</style>
</head>
<body>

<header class="power">
  <div class="power-inner">
    <div class="brand">
      <div>MUNCHKIN<small>POWER TRACKER</small></div>
      <div class="skin" role="group" aria-label="Look">
        <button id="skinPixel" data-skin="pixel" aria-pressed="true">Pixel</button>
        <button id="skinModern" data-skin="modern" aria-pressed="false">Modern</button>
      </div>
    </div>
    <div class="strength">
      <div class="lbl">COMBAT</div>
      <div class="num" id="total">1</div>
      <div class="math" id="math">Lvl 1 + Bonus 0</div>
    </div>
  </div>
</header>

<main class="wrap">
  <h2>Level <span>First to 10 wins</span></h2>
  <section class="level px" id="levelCard">
    <button class="btn down lg" id="lvlDown" aria-label="Level down"></button>
    <div>
      <div class="big" id="lvl">1</div>
      <div class="cap" id="lvlCap">Keep kicking doors</div>
    </div>
    <button class="btn up lg" id="lvlUp" aria-label="Level up"></button>
    <div class="pips" id="pips" aria-hidden="true"></div>
  </section>

  <h2>Gear <span id="gearTotal">+0</span></h2>
  <section class="slots" id="slots"></section>

  <h2>Extra stuff <span id="extraTotal">+0</span></h2>
  <section class="slots" id="extras"></section>
  <div class="row">
    <button class="tbtn gold" id="addExtra">+ Add item</button>
  </div>

  <div class="row" style="margin-top:10px">
    <button class="tbtn danger" id="reset">New game</button>
  </div>
  <p class="foot">Combat strength = your level + every bonus. Saves on this device.</p>
</main>

<script>
(() => {
  // ---------- Pixel sprites (8x8). Letters map to palette colors. ----------
  const PAL = { k:"#0d0915", g:"#ffcc33", s:"#c9c4d6", d:"#7c7590", r:"#e8473c", b:"#8a5a2b", w:"#f4ead2", n:"#5fd068", p:"#9b6be0" };
  const SPRITES = {
    head:  ["..kkkk..",".kssssk.","kssssssk","ksdkkdsk","ksk..ksk","ksk..ksk",".kk..kk.","........"],
    armor: ["kk....kk","kskkkksk","ksssssk.","kssgsssk","kssssssk",".kssssk.",".kssssk.","..kkkk.."],
    foot:  ["..kkk...","..kbk...","..kbk...","..kbk...","..kbbkk.","..kbbbbk",".kbbbbbk",".kkkkkkk"],
    hand:  [".......k","......ks",".....ks.","....ks..","k..ks...",".kks....","..kk....",".k.kk..."],
    shield:["kkkkkkk.","krrgrrk.","krrgrrk.","kgggggk.","krrgrrk.",".krgrk..","..kgk...","...k...."],
    big:   ["...kk...","..kppk..",".kpppk..","kpppppk.","kpgppppk","kpppppk.",".kpppk..","..kkk..."],
    up:    ["...kk...","..kwwk..",".kwwwwk.","kwwwwwwk","kkkwwkkk","..kwwk..","..kwwk..","..kkkk.."],
    down:  ["..kkkk..","..kwwk..","..kwwk..","kkkwwkkk","kwwwwwwk",".kwwwwk.","..kwwk..","...kk..."],
    plus:  ["........","...kk...","..kwwk..",".kkwwkk.",".kwwwwk.",".kkwwkk.","..kwwk..","...kk..."],
    minus: ["........","........","........",".kkkkkk.",".kwwwwk.",".kkkkkk.","........","........"],
  };
  // ---------- Modern line icons (24x24, drawn with the current text color) ----------
  const PATHS = {
    head:   '<path d="M4 17v-3a8 8 0 0 1 16 0v3"/><path d="M2.5 17h19"/><path d="M12 6V3"/><path d="M9 14h6"/>',
    armor:  '<path d="M8 3 4 5.5V11l2 1v9h12v-9l2-1V5.5L16 3a4 4 0 0 1-8 0z"/>',
    foot:   '<path d="M6 3h6v8l5.5 2.5A3 3 0 0 1 20 16.2V19H6z"/><path d="M6 15h5"/><path d="M4 21h18"/>',
    shield: '<path d="M12 3 4.5 6v6c0 4.6 3.2 7.8 7.5 9 4.3-1.2 7.5-4.4 7.5-9V6z"/><path d="M12 8v8"/><path d="M8.5 11.5h7"/>',
    hand:   '<path d="M14.5 17.5 4 7V4h3l10.5 10.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/>',
    big:    '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/>',
    up:     '<path d="m6 15 6-6 6 6"/>',
    down:   '<path d="m6 9 6 6 6-6"/>',
    plus:   '<path d="M12 5v14"/><path d="M5 12h14"/>',
    minus:  '<path d="M5 12h14"/>',
  };
  function icon(name, px, svgPx) {
    const wrap = document.createElement("span");
    wrap.className = "icon";
    const c = document.createElement("canvas");
    c.className = "pix"; c.width = 8; c.height = 8;
    c.style.width = c.style.height = px + "px";
    const ctx = c.getContext("2d");
    SPRITES[name].forEach((row, y) => [...row].forEach((ch, x) => {
      if (PAL[ch]) { ctx.fillStyle = PAL[ch]; ctx.fillRect(x, y, 1, 1); }
    }));
    const s = svgPx || Math.round(px * 0.75);
    wrap.insertAdjacentHTML("beforeend",
      `<svg class="mod" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[name]}</svg>`);
    wrap.prepend(c);
    return wrap;
  }

  // ---------- Gear slots from the Munchkin rules ----------
  const SLOTS = [
    { id:"head",  name:"Headgear",   note:"1 helmet or hat",       icon:"head" },
    { id:"armor", name:"Armor",      note:"1 suit of armor",       icon:"armor" },
    { id:"foot",  name:"Footgear",   note:"1 pair of boots",       icon:"foot" },
    { id:"left",  name:"Left hand",  note:"1-hand weapon/shield",  icon:"shield" },
    { id:"right", name:"Right hand", note:"1-hand weapon/shield",  icon:"hand" },
    { id:"big",   name:"Big item",   note:"Only 1 unless you're a Dwarf", icon:"big" },
  ];

  const KEY = "munchkin-tracker-v1";
  const SKIN_KEY = "munchkin-skin";
  const fresh = () => ({ level: 1, gear: Object.fromEntries(SLOTS.map(s => [s.id, 0])), extras: [], nextId: 1 });
  let state = fresh();
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && typeof saved.level === "number") state = Object.assign(fresh(), saved, { gear: Object.assign(fresh().gear, saved.gear) });
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  const $ = id => document.getElementById(id);
  const fmt = n => (n > 0 ? "+" : "") + n;
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  function paintVal(out, v) {
    out.textContent = fmt(v);
    out.classList.toggle("pos", v > 0);
    out.classList.toggle("neg", v < 0);
  }

  // ---------- Look toggle ----------
  function setSkin(skin) {
    document.documentElement.dataset.skin = skin;
    $("skinPixel").setAttribute("aria-pressed", skin === "pixel");
    $("skinModern").setAttribute("aria-pressed", skin === "modern");
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    try { localStorage.setItem(SKIN_KEY, skin); } catch (e) {}
  }
  $("skinPixel").onclick = () => setSkin("pixel");
  $("skinModern").onclick = () => setSkin("modern");
  setSkin(document.documentElement.dataset.skin === "modern" ? "modern" : "pixel");

  function stepper(onChange) {
    const down = document.createElement("button");
    down.className = "btn sm down"; down.setAttribute("aria-label", "Minus 1");
    down.appendChild(icon("minus", 24, 20));
    const up = document.createElement("button");
    up.className = "btn sm up"; up.setAttribute("aria-label", "Plus 1");
    up.appendChild(icon("plus", 24, 20));
    const out = document.createElement("div");
    out.className = "val";
    down.onclick = () => onChange(-1);
    up.onclick = () => onChange(1);
    return { down, up, out };
  }

  // Build gear rows once
  const gearOut = {};
  SLOTS.forEach(s => {
    const row = document.createElement("div");
    row.className = "slot px";
    const ico = icon(s.icon, 40, 22); ico.classList.add("ico");
    const name = document.createElement("div");
    name.className = "name";
    name.innerHTML = `<b>${s.name}</b><small>${s.note}</small>`;
    const st = stepper(d => { state.gear[s.id] = clamp(state.gear[s.id] + d, -20, 30); render(); });
    gearOut[s.id] = st.out;
    row.append(ico, name, st.down, st.out, st.up);
    $("slots").appendChild(row);
  });

  function renderExtras() {
    const box = $("extras");
    box.innerHTML = "";
    if (!state.extras.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "No extras yet. Add one for a one-shot potion, a race or class bonus, a curse, or that card you \"found\".";
      box.appendChild(p);
      return;
    }
    state.extras.forEach(item => {
      const row = document.createElement("div");
      row.className = "slot extra px";
      const inp = document.createElement("input");
      inp.className = "name-in"; inp.id = "extra-" + item.id;
      inp.value = item.name; inp.setAttribute("aria-label", "Item name");
      inp.oninput = () => { item.name = inp.value; save(); };
      const st = stepper(d => {
        item.bonus = clamp(item.bonus + d, -20, 30);
        paintVal(st.out, item.bonus); // render() only refreshes the gear rows, so update this row's number here
        render();
      });
      paintVal(st.out, item.bonus);
      const del = document.createElement("button");
      del.className = "tbtn ghost del"; del.textContent = "Remove";
      del.onclick = () => { state.extras = state.extras.filter(x => x !== item); renderExtras(); render(); };
      row.append(inp, st.down, st.out, st.up, del);
      box.appendChild(row);
    });
  }

  // Level controls
  $("lvlDown").appendChild(icon("down", 32, 28));
  $("lvlUp").appendChild(icon("up", 32, 28));
  $("lvlDown").onclick = () => { state.level = clamp(state.level - 1, 1, 10); render(); };
  $("lvlUp").onclick = () => { state.level = clamp(state.level + 1, 1, 10); render(); };
  for (let i = 0; i < 10; i++) $("pips").appendChild(document.createElement("i"));

  $("addExtra").onclick = () => {
    const id = state.nextId++;
    state.extras.push({ id, name: "Extra item " + id, bonus: 1 });
    renderExtras(); render();
    const el = $("extra-" + id); if (el) { el.focus(); el.select(); }
  };

  // Two-tap reset (no confirm dialogs in the viewer)
  let armed = null;
  $("reset").onclick = () => {
    const b = $("reset");
    if (!armed) {
      b.textContent = "Tap again to reset";
      armed = setTimeout(() => { armed = null; b.textContent = "New game"; }, 3000);
      return;
    }
    clearTimeout(armed); armed = null; b.textContent = "New game";
    state = fresh(); renderExtras(); render();
  };

  function render() {
    const gear = SLOTS.reduce((a, s) => a + state.gear[s.id], 0);
    const extra = state.extras.reduce((a, x) => a + x.bonus, 0);
    const bonus = gear + extra;
    $("lvl").textContent = state.level;
    $("total").textContent = state.level + bonus;
    $("math").textContent = `Lvl ${state.level} + Bonus ${bonus}`;
    $("gearTotal").textContent = fmt(gear);
    $("extraTotal").textContent = fmt(extra);
    SLOTS.forEach(s => paintVal(gearOut[s.id], state.gear[s.id]));
    [...$("pips").children].forEach((p, i) => p.classList.toggle("on", i < state.level));
    const win = state.level >= 10;
    $("levelCard").classList.toggle("win", win);
    $("lvlCap").textContent = win ? "You win!" : state.level === 9 ? "One more level" : "Keep kicking doors";
    save();
  }

  renderExtras();
  render();
})();
</script>
</body>
</html>
